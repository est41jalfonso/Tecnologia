      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#g)"/>
  <circle cx="560" cy="60" r="130" fill="#ffffff" opacity="0.06"/>
  <circle cx="80" cy="310" r="100" fill="#ffffff" opacity="0.05"/>
  <!-- Tarjeta flotante estilo UI moderna -->
  <rect x="36" y="34" width="568" height="292" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  <rect x="60" y="56" width="230" height="28" rx="14" fill="#ffffff" fill-opacity="0.92"/>
  <text x="76" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a">LISTA DE VIDEOS • WORKSPACE</text>

  <text x="60" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">Gmail y Herramientas Google</text>
  <text x="60" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#e2e8f0">Organiza correo, etiquetas y productividad</text>

  <!-- Barra de progreso decorativa -->
  <rect x="60" y="268" width="420" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
