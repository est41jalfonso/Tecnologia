  <text x="62" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e293b">"¡Excelente claridad en tus propuestas para cerrar la llave! Siguiente paso: revisar mayúsculas en los subtítulos."</text>
