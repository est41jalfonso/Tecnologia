  <text x="46" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#312e81">Producto: Folleto Comunitario • 3.º Primaria • Campo: Ética, Naturaleza y Sociedades</text>

  <!-- Cabecera tabla -->
