  <text x="794" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Sobresaliente</text>

  <!-- Fila 1 -->
  <rect x="44" y="162" width="212" height="104" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">1. Aprendizaje (PDA)</text>
  <text x="54" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569">Identificar causas del</text>
  <text x="54" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569">desperdicio de agua.</text>

  <rect x="262" y="162" width="160" height="104" rx="6" fill="#ffffff" stroke="#fecaca"/>
  <text x="272" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Mencionar 1 problema</text>
  <text x="272" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">del agua solo con</text>
  <text x="272" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">ayuda del docente.</text>

  <rect x="428" y="162" width="160" height="104" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <text x="438" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Describir 2 causas</text>
  <text x="438" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">de desperdicio con</text>
  <text x="438" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">dibujos básicos.</text>

  <rect x="594" y="162" width="160" height="104" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="604" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Explicar causas y</text>
  <text x="604" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">consecuencias con</text>
  <text x="604" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">ejemplos claros.</text>

  <rect x="760" y="162" width="156" height="104" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="770" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Explicar causas con</text>
  <text x="770" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">datos reales de su</text>
  <text x="770" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">colonia o escuela.</text>

  <!-- Fila 2 -->
  <rect x="44" y="274" width="212" height="104" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">2. Impacto Comunitario</text>
  <text x="54" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569">Proponer acciones de</text>
  <text x="54" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569">cuidado aplicables.</text>

  <rect x="262" y="274" width="160" height="104" rx="6" fill="#ffffff" stroke="#fecaca"/>
  <text x="272" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Incluir recomendaciones</text>
  <text x="272" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">poco claras o muy</text>
  <text x="272" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">generales.</text>

  <rect x="428" y="274" width="160" height="104" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <text x="438" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Proponer 2 acciones</text>
  <text x="438" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">simples para ahorrar</text>
  <text x="438" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">agua en casa.</text>

  <rect x="594" y="274" width="160" height="104" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="604" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Proponer 3 acciones</text>
  <text x="604" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">viables en escuela y</text>
  <text x="604" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">hogar con dibujos.</text>

  <rect x="760" y="274" width="156" height="104" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="770" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Proponer acciones y</text>
  <text x="770" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">compartir el folleto</text>
  <text x="770" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">con otras familias.</text>

  <!-- Fila 3 -->
  <rect x="44" y="386" width="212" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">3. Trabajo Colaborativo</text>
  <text x="54" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569">Participar y escuchar.</text>

  <rect x="262" y="386" width="160" height="82" rx="6" fill="#ffffff" stroke="#fecaca"/>
  <text x="272" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Trabajar aislado.</text>
  <rect x="428" y="386" width="160" height="82" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <text x="438" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Cumplir solo su parte.</text>
  <rect x="594" y="386" width="160" height="82" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="604" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Aportar y respetar.</text>
  <rect x="760" y="386" width="156" height="82" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="770" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Guiar y apoyar al equipo.</text>

