  <text x="462" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">En desarrollo</text>

  <rect x="594" y="116" width="160" height="38" rx="6" fill="#dcfce7"/>
  <text x="646" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">Logrado</text>

